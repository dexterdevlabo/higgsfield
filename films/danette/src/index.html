<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Danette — concept film</title>
<style>
  @font-face{font-family:'Young Serif';src:url('assets/fonts/YoungSerif-Regular.ttf') format('truetype');font-weight:400;font-display:block}
  @font-face{font-family:'Outfit';src:url('assets/fonts/Outfit-Regular.ttf') format('truetype');font-weight:400;font-display:block}
  @font-face{font-family:'Outfit';src:url('assets/fonts/Outfit-Bold.ttf') format('truetype');font-weight:700;font-display:block}

  /* Palette sampled from the dessert itself — chocolate, caramel, vanilla, cream.
     No Danone brand colour, logo or packaging is reproduced. */
  :root{
    --choc-deep:#160D07; --choc:#2E1A0F; --choc-mid:#4A2A18;
    --caramel:#C98A3C;   --caramel-lt:#E0A848;
    --vanilla:#EBD9A8;   --cream:#F6EBD8;
    --muted:#A98C6E;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;background:var(--choc-deep);overflow:hidden}
  #root{position:relative;width:1920px;height:1080px;background:var(--choc-deep);
        font-family:'Outfit',sans-serif;overflow:hidden}
  .scene{position:absolute;inset:0;overflow:hidden}
  .serif{font-family:'Young Serif',serif;font-weight:400}
  .kicker{font-family:'Outfit';font-weight:700;font-size:26px;letter-spacing:.26em;
          text-transform:uppercase;color:var(--caramel)}
  .vig{position:absolute;inset:0;pointer-events:none;
       background:radial-gradient(ellipse 70% 66% at 50% 48%,rgba(0,0,0,0) 36%,rgba(0,0,0,.60) 100%)}
  /* warm top-light, so the chocolate field reads as a surface not a flat fill */
  .light{position:absolute;inset:0;pointer-events:none;
         background:radial-gradient(ellipse 60% 48% at 50% 22%,rgba(201,138,60,.17) 0%,rgba(0,0,0,0) 70%)}
  .word{display:inline-block;transform-origin:50% 100%}
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-fps="30">

  <!-- ===== S1 · 0.00–3.30 · the swirl ===== -->
  <div class="scene" id="s1" data-start="0" data-duration="3.35" style="z-index:10">
    <div class="light"></div>
    <svg id="swirlSvg" width="1920" height="1080" style="position:absolute;inset:0">
      <path id="swirl" fill="none" stroke="#F6EBD8" stroke-width="30"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div style="position:absolute;left:150px;top:392px;width:720px">
      <div id="s1k" class="kicker" style="opacity:0">Depuis 1970</div>
      <div id="s1h" class="serif" style="opacity:0;margin-top:26px;font-size:92px;
           line-height:1.02;color:var(--cream)">Une cuillère<br>qui fait lever<br>la France.</div>
    </div>
    <div class="vig"></div>
  </div>

  <!-- ===== S2 · 3.30–6.40 · the three flavours rise ===== -->
  <div class="scene" id="s2" data-start="3.3" data-duration="3.15" style="z-index:20;background:var(--choc-deep)">
    <div class="light"></div>
    <div id="s2k" class="kicker" style="position:absolute;left:150px;top:220px">Trois classiques</div>
    <div style="position:absolute;left:150px;top:320px;width:1620px;height:520px">
      <div class="col" id="c1" style="position:absolute;left:0;bottom:0;width:500px;height:0;
           background:var(--choc-mid);border-radius:18px 18px 0 0"></div>
      <div class="col" id="c2" style="position:absolute;left:560px;bottom:0;width:500px;height:0;
           background:var(--caramel);border-radius:18px 18px 0 0"></div>
      <div class="col" id="c3" style="position:absolute;left:1120px;bottom:0;width:500px;height:0;
           background:var(--vanilla);border-radius:18px 18px 0 0"></div>
    </div>
    <div style="position:absolute;left:150px;top:880px;width:1620px">
      <span id="f1" class="serif" style="position:absolute;left:0;width:500px;text-align:center;
            font-size:54px;color:var(--cream);opacity:0">Chocolat</span>
      <span id="f2" class="serif" style="position:absolute;left:560px;width:500px;text-align:center;
            font-size:54px;color:var(--cream);opacity:0">Caramel</span>
      <span id="f3" class="serif" style="position:absolute;left:1120px;width:500px;text-align:center;
            font-size:54px;color:var(--cream);opacity:0">Vanille</span>
    </div>
    <div class="vig"></div>
  </div>

  <!-- ===== S3 · 6.40–9.40 · the number ===== -->
  <div class="scene" id="s3" data-start="6.4" data-duration="3.05" style="z-index:30;background:var(--choc-deep)">
    <div class="light"></div>
    <div style="position:absolute;left:0;right:0;top:300px;text-align:center">
      <div id="s3k" class="kicker">En France</div>
      <div id="s3n" class="serif" style="opacity:0;margin-top:28px;font-size:230px;line-height:1;
           color:var(--caramel-lt)">1<span style="font-size:120px;color:var(--cream)"> sur </span>2</div>
      <div id="s3s" class="serif" style="opacity:0;margin-top:22px;font-size:60px;color:var(--cream)">
        en mange.</div>
    </div>
    <div class="vig"></div>
  </div>

  <!-- ===== S4 · 9.40–12.70 · the slogan stands up ===== -->
  <div class="scene" id="s4" data-start="9.4" data-duration="3.35" style="z-index:40;background:var(--choc-deep)">
    <div class="light"></div>
    <!-- the line the words rise from -->
    <div id="rule" style="position:absolute;left:150px;top:660px;width:0;height:6px;background:var(--caramel-lt)"></div>
    <div style="position:absolute;left:150px;top:300px;width:1620px">
      <div class="serif" style="font-size:150px;line-height:1.06;color:var(--cream)">
        <span class="word" id="w1" style="transform:rotateX(-70deg)">On</span>
        <span class="word" id="w2" style="opacity:0">se</span>
        <span class="word" id="w3" style="opacity:0">lève</span>
        <span class="word" id="w4" style="opacity:0">tous</span>
      </div>
    </div>
    <div class="vig"></div>
  </div>

  <!-- ===== S5 · 12.60–15.00 · lockup ===== -->
  <div class="scene" id="s5" data-start="12.6" data-duration="2.4" style="z-index:50;background:transparent">
    <div id="mask" style="position:absolute;left:960px;top:540px;width:0;height:0;border-radius:50%;
         background:var(--choc-deep);transform:translate(-50%,-50%);overflow:hidden">
      <div style="position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%)">
        <div class="light"></div>
        <div style="position:absolute;left:0;right:0;top:372px;text-align:center">
          <div id="l1" class="serif" style="font-size:132px;color:var(--cream)">pour Danette.</div>
          <div id="l2" style="margin:36px auto 0;height:5px;width:0;background:var(--caramel)"></div>
          <div id="l3" class="kicker" style="opacity:0;margin-top:34px">Depuis 1970</div>
        </div>
        <div id="l4" style="position:absolute;left:0;right:0;bottom:56px;text-align:center;opacity:0;
             font-size:19px;letter-spacing:.09em;color:#6E5A46">
          Concept film · not an official Danone production
        </div>
      </div>
    </div>
  </div>

  <audio id="mix" data-start="0" data-duration="15" data-volume="1" data-fade-out="0.35"
         src="assets/mix.wav"></audio>

  <svg width="0" height="0" style="position:absolute">
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" stitchTiles="stitch"/></filter>
  </svg>
  <div style="position:absolute;inset:0;z-index:95;pointer-events:none;opacity:.045;
              filter:url(#grain);mix-blend-mode:overlay"></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
(function(){
  /* ---- the cream swirl: an Archimedean spiral, piped on ---- */
  const cx=1390, cy=540, turns=3, steps=900;
  let d='';
  for(let i=0;i<=steps;i++){
    const th=i/steps*turns*2*Math.PI;
    const r=16+th*15.4;
    const x=cx+r*Math.cos(th-Math.PI/2), y=cy+r*Math.sin(th-Math.PI/2);
    d += (i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)+' ';
  }
  const swirl=document.getElementById('swirl');
  swirl.setAttribute('d', d);
  const L=swirl.getTotalLength();
  swirl.style.strokeDasharray=L; swirl.style.strokeDashoffset=L;

  const tl = gsap.timeline({paused:true});
  const E="power3.out", X="power2.in", C="power1.inOut";

  /* ---- S1 ---- */
  tl.to(swirl,{strokeDashoffset:0,duration:2.05,ease:"power1.inOut"},0.10);
  tl.fromTo("#swirlSvg",{scale:1.06,rotate:-5},{scale:1.0,rotate:0,duration:3.2,ease:C},0);
  tl.fromTo("#s1k",{opacity:0,y:14},{opacity:1,y:0,duration:.40,ease:E},0.30);
  tl.fromTo("#s1h",{opacity:0,y:26},{opacity:1,y:0,duration:.60,ease:E},0.52);

  /* ---- S2 · the three rise, staggered ---- */
  [["#c1",520],["#c2",430],["#c3",350]].forEach(([id,h],i)=>
    tl.fromTo(id,{height:0},{height:h,duration:.62,ease:E},3.32+i*0.12));
  ["#f1","#f2","#f3"].forEach((id,i)=>
    tl.fromTo(id,{opacity:0,y:16},{opacity:1,y:0,duration:.36,ease:E},3.64+i*0.12));

  /* ---- S3 · the number ---- */
  tl.fromTo("#s3n",{opacity:0,y:30,scale:.94},{opacity:1,y:0,scale:1,duration:.54,ease:"back.out(1.4)"},6.46);
  tl.fromTo("#s3s",{opacity:0,y:18},{opacity:1,y:0,duration:.38,ease:E},6.86);

  /* ---- S4 · the words literally stand up ----
     rotateX from flat-on-the-line to upright, hinged at the baseline. */
  tl.fromTo("#rule",{width:60},{width:1620,duration:.64,ease:E},9.40);
  tl.fromTo("#w1",{rotateX:-70,y:26},{rotateX:0,y:0,duration:.62,ease:"back.out(1.5)"},9.40);
  ["#w2","#w3","#w4"].forEach((id,i)=>{
    tl.fromTo(id,{opacity:0,rotateX:-92,y:34},
                 {opacity:1,rotateX:0,y:0,duration:.60,ease:"back.out(1.5)"},9.57+i*0.17);
  });

  /* ---- S5 · lockup, opened by a mask ---- */
  tl.fromTo("#mask",{width:0,height:0},{width:4700,height:4700,duration:.66,ease:E},12.60);
  tl.fromTo("#l2",{width:0},{width:360,duration:.52,ease:E},13.02);
  tl.fromTo("#l3",{opacity:0,y:14},{opacity:1,y:0,duration:.38,ease:E},13.26);
  tl.fromTo("#l4",{opacity:0},{opacity:1,duration:.44,ease:E},13.70);

  /* hold to a full 15.00s — the renderer takes its length from this timeline */
  tl.to("#l3",{opacity:1,duration:.86,ease:"none"},14.14);

  window.__timelines = window.__timelines || {};
  window.__timelines["root"] = tl;
})();
</script>
</div>
</body>
</html>
